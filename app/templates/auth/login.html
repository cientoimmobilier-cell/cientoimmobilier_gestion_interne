<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Ciento Immobilier</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <!-- Bootstrap 5 CSS (local) -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <!-- FontAwesome (local) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <!-- Police Outfit (locale) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/outfit/outfit.css') }}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="login-bg">

    <div class="login-card shadow">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Ciento Logo" class="img-fluid mb-3 rounded-3 shadow-sm" style="max-height: 70px;">
            <h2 class="fw-bold text-dark mb-0">CIENTO</h2>
            <span class="text-muted text-uppercase fw-semibold" style="font-size: 0.8rem; letter-spacing: 3px;">Gestion Immobilière</span>
        </div>

        <!-- Messages Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show border-0 rounded-3 shadow-sm" role="alert" style="font-size: 0.9rem;">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="email" class="form-label text-dark fw-semibold" style="font-size: 0.9rem;">Adresse e-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3" style="border-color: var(--border-color);"><i class="fa-solid fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control form-control-premium border-start-0 rounded-end-3" id="email" name="email" placeholder="nom@exemple.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-dark fw-semibold" style="font-size: 0.9rem;">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3" style="border-color: var(--border-color);"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control form-control-premium border-start-0 rounded-end-3" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label text-muted" for="remember" style="font-size: 0.85rem;">Se souvenir de moi</label>
                </div>
            </div>

            <button type="submit" class="btn btn-premium w-100 py-3 shadow-sm fw-semibold"><i class="fa-solid fa-sign-in-alt me-2"></i>Se connecter</button>
        </form>
        
        <div class="mt-4 text-center">
            <p class="text-muted mb-0" style="font-size: 0.75rem;">© 2026 Ciento Immobilier. Tous droits réservés.</p>
        </div>
    </div>

    <!-- Bootstrap JS Bundle (local) -->
    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}" nonce="{{ csp_nonce() }}"></script>
</body>
</html>
