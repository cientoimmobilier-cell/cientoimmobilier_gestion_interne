{% extends "base.html" %}

{% block title %}{{ action_title }} - Ciento Immobilier{% endblock %}
{% block header_title %}{{ action_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10 col-md-12">
        <div class="card-premium">
            <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-address-card text-warning me-2"></i>Informations Client</h5>
            
            <form method="POST">
                <div class="row">
                    <!-- Prénom -->
                    <div class="col-md-6 mb-3">
                        <label for="prenom" class="form-label fw-semibold" style="font-size: 0.9rem;">Prénom</label>
                        <input type="text" class="form-control form-control-premium" id="prenom" name="prenom" placeholder="Jean" value="{{ client.prenom if client else '' }}" required>
                    </div>
                    <!-- Nom -->
                    <div class="col-md-6 mb-3">
                        <label for="nom" class="form-label fw-semibold" style="font-size: 0.9rem;">Nom de famille</label>
                        <input type="text" class="form-control form-control-premium" id="nom" name="nom" placeholder="DUPONT" value="{{ client.nom if client else '' }}" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Téléphone Principal -->
                    <div class="col-md-6 mb-3">
                        <label for="telephone" class="form-label fw-semibold" style="font-size: 0.9rem;">Téléphone principal</label>
                        <input type="tel" class="form-control form-control-premium" id="telephone" name="telephone" placeholder="+33 6 12 34 56 78" value="{{ client.telephone if client else '' }}" required>
                    </div>
                    <!-- Téléphone Secondaire -->
                    <div class="col-md-6 mb-3">
                        <label for="telephone_secondaire" class="form-label fw-semibold" style="font-size: 0.9rem;">Téléphone secondaire</label>
                        <input type="tel" class="form-control form-control-premium" id="telephone_secondaire" name="telephone_secondaire" placeholder="+33 1 23 45 67 89" value="{{ client.telephone_secondaire if client else '' }}">
                    </div>
                </div>

                <div class="row">
                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-semibold" style="font-size: 0.9rem;">Adresse e-mail</label>
                        <input type="email" class="form-control form-control-premium" id="email" name="email" placeholder="jean.dupont@exemple.com" value="{{ client.email if client else '' }}">
                    </div>
                    <!-- Profession -->
                    <div class="col-md-6 mb-3">
                        <label for="profession" class="form-label fw-semibold" style="font-size: 0.9rem;">Profession</label>
                        <input type="text" class="form-control form-control-premium" id="profession" name="profession" placeholder="Cadre supérieur" value="{{ client.profession if client else '' }}">
                    </div>
                </div>

                <div class="row">
                    <!-- Ville -->
                    <div class="col-md-6 mb-3">
                        <label for="ville" class="form-label fw-semibold" style="font-size: 0.9rem;">Ville</label>
                        <input type="text" class="form-control form-control-premium" id="ville" name="ville" placeholder="Paris" value="{{ client.ville if client else '' }}">
                    </div>
                    <!-- Source Client -->
                    <div class="col-md-6 mb-3">
                        <label for="source_client" class="form-label fw-semibold" style="font-size: 0.9rem;">Source du contact</label>
                        <select class="form-select form-control-premium" id="source_client" name="source_client">
                            <option value="Recommandation" {% if client and client.source_client == 'Recommandation' %}selected{% endif %}>Recommandation</option>
                            <option value="Site Internet" {% if client and client.source_client == 'Site Internet' %}selected{% endif %}>Site Internet Ciento</option>
                            <option value="Portail Immo" {% if client and client.source_client == 'Portail Immo' %}selected{% endif %}>Portails Immobiliers (SeLoger, Leboncoin...)</option>
                            <option value="Réseaux Sociaux" {% if client and client.source_client == 'Réseaux Sociaux' %}selected{% endif %}>Réseaux Sociaux</option>
                            <option value="Panneau Agence" {% if client and client.source_client == 'Panneau Agence' %}selected{% endif %}>Panneau / Vitrine Agence</option>
                            <option value="Autre" {% if client and client.source_client == 'Autre' %}selected{% endif %}>Autre</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <!-- Budget Minimum -->
                    <div class="col-md-4 mb-3">
                        <label for="budget_min" class="form-label fw-semibold" style="font-size: 0.9rem;">Budget minimum</label>
                        <input type="number" step="0.01" class="form-control form-control-premium" id="budget_min" name="budget_min" placeholder="100000" value="{{ client.budget_min if client and client.budget_min else '' }}">
                    </div>
                    <!-- Budget Maximum -->
                    <div class="col-md-4 mb-3">
                        <label for="budget_max" class="form-label fw-semibold" style="font-size: 0.9rem;">Budget maximum</label>
                        <input type="number" step="0.01" class="form-control form-control-premium" id="budget_max" name="budget_max" placeholder="500000" value="{{ client.budget_max if client and client.budget_max else '' }}">
                    </div>
                    <!-- Devise -->
                    <div class="col-md-4 mb-3">
                        <label for="devise" class="form-label fw-semibold" style="font-size: 0.9rem;">Devise</label>
                        <select class="form-select form-control-premium" id="devise" name="devise">
                            <option value="EUR" {% if client and client.devise == 'EUR' %}selected{% endif %}>EUR (€)</option>
                            <option value="USD" {% if client and client.devise == 'USD' %}selected{% endif %}>USD ($)</option>
                            <option value="HTG" {% if client and client.devise == 'HTG' %}selected{% endif %}>HTG (Gourdes)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="adresse" class="form-label fw-semibold" style="font-size: 0.9rem;">Adresse complète</label>
                    <textarea class="form-control form-control-premium" id="adresse" name="adresse" rows="2" placeholder="123 Rue de Rivoli, 75001 Paris">{{ client.adresse if client else '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label for="observations" class="form-label fw-semibold" style="font-size: 0.9rem;">Observations / Notes</label>
                    <textarea class="form-control form-control-premium" id="observations" name="observations" rows="4" placeholder="Client sérieux, recherche urgente... Mentions de contraintes de date... Hexagone...">{{ client.observations if client else '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('clients.list_clients') }}" class="btn btn-outline-secondary rounded-3">Annuler</a>
                    <button type="submit" class="btn btn-accent rounded-3 px-4">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
