services:
  - type: web
    name: cientoimmobilier-gestion
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: ciento-db
          property: connectionString

databases:
  - name: ciento-db
    databaseName: gestion_immobiliere
    user: gestion_user
    plan: free