services:
  - type: web
    name: ciento-immobilier
    env: python
    plan: free
    
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "python init_db.py"
    startCommand: "gunicorn run:app"
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL 
        fromDatabase:
          name: ciento_immobilier_db
          property: connectionString

databases:
  - name: ciento_immobilier_db
    databaseName: ciento_immobilier
    user: postgres
    plan: free
    postgresMajorVersion: 15