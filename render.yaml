services:
  # Base de données gérée par Render
  - type: psql
    name: ciento-db
    plan: free # A ajuster selon le besoin en production
    postgresMajorVersion: 15

  # Application Web Flask
  - type: web
    name: ciento-immobilier
    env: python
    region: frankfurt # Optionnel
    plan: free # A ajuster selon le besoin en production
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # Render générera automatiquement une clé sécurisée
      - key: DATABASE_URL
        fromDatabase:
          name: ciento-db
          property: connectionString
